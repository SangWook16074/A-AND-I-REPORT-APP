<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="A&I">
  <meta property="og:description" content="함께 성장하는 IT 동아리, A&I">
  <meta property="og:image" content="https://aandiclub.com/og_img_v2.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1535">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://aandiclub.com/og_img_v2.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico">
  <title>A&I</title>
  <link rel="stylesheet" href="/app/app.css">
  <script>
    // 과거 Flutter 서비스워커/캐시가 남아 있으면 새 HTML UI 대신 구 앱이 뜰 수 있어 정리한다.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys.filter((k) => /^(flutter-|workbox)/.test(k)).map((k) => caches.delete(k)),
          );
        }
      } catch (error) {
        console.warn('[cache cleanup] failed:', error);
      }
    })();
  </script>
</head>
<body>
  <header class="top-bar" data-header>
    <div class="top-bar__inner">
      <a class="top-bar__logo" href="/" data-link aria-label="A&I 홈">
        <img src="/app/logo.webp" alt="A&I">
      </a>
      <nav class="top-bar__nav" aria-label="주 메뉴" data-nav></nav>
      <div class="top-bar__menu" data-menu-root>
        <button class="top-bar__menu-button" type="button" aria-label="메뉴 열기" aria-haspopup="menu" aria-expanded="false" data-menu-button></button>
        <div class="popup-menu" role="menu" hidden data-menu></div>
      </div>
    </div>
  </header>

  <main id="main" class="site-main" data-view tabindex="-1"></main>

  <footer class="footer" data-footer>

      <img class="footer__logo" src="/app/logo.webp" alt="A&I">
      <p class="footer__copy">© 2026 A&I. All rights reserved.</p>
    </div>
  </footer>

  <script src="/app/analytics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" defer></script>
  <script src="/app/app.js" type="module"></script>
</body>
</html>
