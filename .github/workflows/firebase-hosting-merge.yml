name: Deploy to Firebase Hosting on merge
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version: '3.41.2'

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Node.js (for recruit-designer JS bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web_recruit dependencies
        working-directory: web_recruit
        run: npm ci

      - name: Build web_recruit (outputs to web/recruit-designer/)
        working-directory: web_recruit
        run: npm run build

      - name: Build Flutter Web (HTML renderer for WebView compat, release mode)
        run: flutter build web --release --web-renderer html --dart-define=API_URL=${{ secrets.BASE_URL }} --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AANDI_REPORT_WEB }}
          channelId: live
          projectId: aandi-report-web
          target: main
