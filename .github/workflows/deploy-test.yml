name: Deploy to Test Channel (Main Branch)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
      
      - name: Initialize submodules
        run: git submodule update --init --recursive

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=API_URL=${{ secrets.BASE_URL }} --pwa-strategy=none

      - name: Set up Node.js (for recruit-designer static page)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web_recruit dependencies
        working-directory: web_recruit
        run: npm ci

      - name: Build web_recruit (static recruit-designer page)
        working-directory: web_recruit
        run: npm run build

      - name: Deploy to Firebase Hosting (Test)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AANDI_REPORT_WEB }}
          channelId: live
          projectId: aandi-report-web
          target: sub
